[workspace]
resolver = "3"
members = [
    "crates/snipunix-core",
    "crates/snipunix-capture",
    "crates/snipunix-annotate",
    "crates/snipunix-settings",
    "crates/snipunix-ocr",
    "crates/snipunix-overlay",
    "crates/snipunix-record",
    "crates/snipunix-app",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Snipunix contributors"]
repository = "https://github.com/alokverma9/snipunix"

[workspace.dependencies]
snipunix-core = { path = "crates/snipunix-core" }
snipunix-capture = { path = "crates/snipunix-capture" }
snipunix-annotate = { path = "crates/snipunix-annotate" }
snipunix-settings = { path = "crates/snipunix-settings" }
snipunix-ocr = { path = "crates/snipunix-ocr" }
snipunix-overlay = { path = "crates/snipunix-overlay" }
snipunix-record = { path = "crates/snipunix-record" }

gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
gdk = { package = "gdk4", version = "0.11.5" }
glib = "0.22.10"
gio = "0.22.10"
libadwaita = { version = "0.9.2", features = ["v1_5"] }
ashpd = { version = "0.14.0", default-features = false, features = [
    "async-io",
    "gtk4",
    "screenshot",
    "screencast",
    "global_shortcuts",
] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
cosmic-text = { version = "0.19.0", default-features = false, features = [
    "std",
    "swash",
    "fontconfig",
] }
serde = { version = "1", features = ["derive"] }
toml = "1.2"
sha2 = "0.10"
ureq = "3.5"
ocrs = { version = "0.14", default-features = false, features = ["rten"] }
rten = "0.28"
rten-imageproc = "0.28"
ksni = { version = "0.3.7", default-features = false, features = [
    "blocking",
    "async-io",
] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-io = "2"
async-channel = "2"
futures-lite = "2"
url = "2"
x11rb = { version = "0.14", default-features = false, features = [
    "image",
    "randr",
    "xfixes",
] }
gstreamer = { version = "0.24.5", default-features = false, features = ["v1_24"] }
ctrlc = "3.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
